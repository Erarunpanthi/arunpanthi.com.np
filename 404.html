<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes"
  >
  <meta name="description" content="404 - Page not found.">
  <meta name="robots" content="noindex, follow">
  <title>404 • Page Not Found</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/fontawesome/css/all.min.css?v=20260924">

  <link rel="stylesheet" href="/css/404.css">
</head>
<body>

  <div class="page-wrap">
    <main class="error-card">
      <div class="warning-banner" role="alert">
        <div class="warning-banner-icon" aria-hidden="true">⚠️</div>
        <div class="warning-banner-copy">
          <h2 class="warning-title">Final warning</h2>
          <p class="warning-text">
            If you repeat this activity, you will be banned from using this website.
          </p>
        </div>
      </div>

      <h1 class="error-code">404</h1>
      <p class="error-message">🚧 Oops! Route not found.</p>
      <p class="error-description">
        The page you requested does not exist or has been moved.
        You are being redirected to the homepage automatically.
      </p>

      <div class="countdown-box">
        <span class="countdown-label">Redirecting to homepage in</span>
        <span class="countdown" id="redirect-countdown" aria-hidden="true">10</span>
      </div>

      <a href="https://arunpanthi.com.np/" class="home-link">
        <i class="fas fa-home"></i>
        Homepage
        <i class="fas fa-arrow-right"></i>
      </a>

      <div class="animation-area">
        <div class="road">
          <div class="road-lines"></div>

          <div class="car drive" id="car">
            <i class="fas fa-car-side"></i>
          </div>

          <div class="sign-404" id="sign404">404</div>
          <div class="gravel"></div>
        </div>
      </div>
    </main>
  </div>

  <noscript>
    <p class="noscript-warning">
      JavaScript is disabled, so the automatic redirect cannot run.
      Please <a href="https://arunpanthi.com.np/">go to the homepage</a>.
    </p>
  </noscript>

  <script>
    (function () {
      "use strict";

      var HOME_URL = "https://arunpanthi.com.np/";
      var REDIRECT_SECONDS = 10;

      // Dated Current Affairs exam URLs are real routes. On static hosts the
      // 404 document is the fallback, so forward the date to the one exam
      // template instead of treating the visitor as a rule-breaker.
      var examMatch = window.location.pathname.match(
        /^\/Psc-preparation\/Current-Affairs\/exam\/date=(\d{4}-\d{2}-\d{2})\/?$/
      );
      if (examMatch) {
        var examParams = new URLSearchParams(window.location.search);
        examParams.set("date", examMatch[1]);
        window.location.replace(
          "/Psc-preparation/Current-Affairs/exam.html?" + examParams.toString() + window.location.hash
        );
        return;
      }

      // Unknown route: show the final warning, then divert to the homepage.
      var countdownEl = document.getElementById("redirect-countdown");
      var remaining = REDIRECT_SECONDS;
      if (countdownEl) countdownEl.textContent = String(remaining);

      var timer = setInterval(function () {
        remaining -= 1;
        if (countdownEl) {
          countdownEl.textContent = String(remaining > 0 ? remaining : 0);
        }
        if (remaining <= 0) {
          clearInterval(timer);
          window.location.replace(HOME_URL);
        }
      }, 1000);

      // Keep the existing 404 animation, but let it finish before the redirect.
      var car = document.getElementById("car");
      var sign = document.getElementById("sign404");

      if (car && sign) {
        setTimeout(function () {
          car.classList.remove("drive");
          car.classList.add("fall");
          sign.classList.add("show");
        }, 1600);
      }
    })();
  </script>

  <script src="js/layout.js"></script>
</body>
</html>
