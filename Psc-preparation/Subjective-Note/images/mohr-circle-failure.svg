<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" role="img" aria-labelledby="title desc" width="100%">
  <title id="title">Mohr's circle at failure touching the Mohr-Coulomb failure envelope</title>
  <desc id="desc">Graph with normal stress on the horizontal axis and shear stress on the vertical axis. The straight Mohr-Coulomb failure envelope starts at cohesion 20 on the shear stress axis and rises at the angle of internal friction of 24 degrees. The Mohr circle for major principal stress 297 and minor principal stress 100 is drawn tangent to the envelope. The tangency point gives the normal stress about 159 and shear stress about 91 on the failure plane. The centre is C and the angle at the centre is 2 theta equal to 90 plus phi.</desc>
  <rect width="760" height="480" fill="#ffffff"/>
  <rect x="110" y="40" width="600" height="370" fill="#fbfdfb" stroke="#b9c9bb" stroke-width="1"/>
  <g stroke="#e6ede7" stroke-width="1">
    <line x1="110" y1="92" x2="710" y2="92"/>
    <line x1="110" y1="172" x2="710" y2="172"/>
    <line x1="110" y1="252" x2="710" y2="252"/>
    <line x1="110" y1="332" x2="710" y2="332"/>
    <line x1="206.0" y1="40" x2="206.0" y2="410"/>
    <line x1="302.0" y1="40" x2="302.0" y2="410"/>
    <line x1="398.0" y1="40" x2="398.0" y2="410"/>
    <line x1="494.0" y1="40" x2="494.0" y2="410"/>
    <line x1="590.0" y1="40" x2="590.0" y2="410"/>
    <line x1="686.0" y1="40" x2="686.0" y2="410"/>
  </g>
  <line x1="110" y1="410" x2="712" y2="410" stroke="#2e7d32" stroke-width="2"/>
  <line x1="110" y1="40" x2="110" y2="410" stroke="#2e7d32" stroke-width="2"/>
  <text x="706" y="430" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1b5e20" text-anchor="end">Normal stress, σ (kN/m²)</text>
  <text x="34" y="225" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1b5e20" text-anchor="middle" transform="rotate(-90 34 225)">Shear stress, τ (kN/m²)</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#55665a" text-anchor="middle">
    <text x="206.0" y="426">100</text>
    <text x="302.0" y="426">160</text>
    <text x="398.0" y="426">220</text>
    <text x="494.0" y="426">280</text>
    <text x="590.0" y="426">340</text>
    <text x="686.0" y="426">400</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#55665a" text-anchor="end">
    <text x="102" y="96">200</text>
    <text x="102" y="176">150</text>
    <text x="102" y="256">100</text>
    <text x="102" y="336">50</text>
  </g>

  <line x1="110.0" y1="349.5" x2="686.0" y2="93.1" stroke="#c62828" stroke-width="2.4" stroke-linecap="round"/>
  <text x="676" y="81" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#c62828" text-anchor="end">τ = c + σ tan φ</text>

  <circle cx="110" cy="378.0" r="3.5" fill="#c62828"/>
  <text x="120" y="370.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#c62828">c = 20</text>

  <path d="M 206.0 410 A 159.0 159.0 0 0 1 523.9 410" fill="none" stroke="#1565c0" stroke-width="2.6"/>
  <line x1="206.0" y1="410" x2="523.9" y2="410" stroke="#1565c0" stroke-width="1.6" stroke-dasharray="5 4"/>

  <circle cx="365.0" cy="410" r="3.5" fill="#1565c0"/>
  <text x="365.0" y="428" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#0d47a1" text-anchor="middle">C</text>

  <line x1="365.0" y1="410" x2="300.3" y2="264.8" stroke="#1565c0" stroke-width="1.4" stroke-dasharray="5 4"/>
  <circle cx="300.3" cy="264.8" r="4.5" fill="#0d47a1" stroke="#ffffff" stroke-width="1.5"/>
  <text x="286" y="251" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#0d47a1" text-anchor="end">(σ, τ) on failure plane</text>
  <text x="317" y="357" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#0d47a1">R = 99.4</text>

  <path d="M 405.0 410 A 40 40 0 0 0 348.7 373.5" fill="none" stroke="#7e57c2" stroke-width="1.6"/>
  <text x="413.0" y="398" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="bold" fill="#5e35b1">2θ = 90° + φ</text>

  <line x1="206.0" y1="410" x2="206.0" y2="418" stroke="#2e7d32" stroke-width="2"/>
  <line x1="523.9" y1="410" x2="523.9" y2="418" stroke="#2e7d32" stroke-width="2"/>
  <text x="206.0" y="446" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#1b5e20" text-anchor="middle">σ3 = 100</text>
  <text x="523.9" y="446" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#1b5e20" text-anchor="middle">σ1 = 299</text>

  <rect x="122" y="52" width="352" height="60" fill="#ffffff" stroke="#c3d2c5" stroke-width="1" rx="4"/>
  <g stroke-linecap="round">
    <line x1="134" y1="74" x2="168" y2="74" stroke="#c62828" stroke-width="2.4"/>
    <line x1="134" y1="98" x2="168" y2="98" stroke="#1565c0" stroke-width="2.6"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#33443a">
    <text x="176" y="78">Mohr–Coulomb failure envelope (c = 20, φ = 24°)</text>
    <text x="176" y="102">Mohr circle at failure (σ3 = 100, σ1 = 299)</text>
  </g>

  <rect x="498" y="300" width="198" height="96" fill="#f7fbf7" stroke="#c3d2c5" stroke-width="1" rx="4"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#1b5e20">
    <text x="510" y="318" font-weight="bold">On the failure plane</text>
    <text x="510" y="336">σ = 159 kN/m²</text>
    <text x="510" y="354">τ = 91 kN/m²</text>
    <text x="510" y="372">Check: 20 + 159 tan24°</text>
    <text x="510" y="388">= 91 kN/m²</text>
  </g>
</svg>
