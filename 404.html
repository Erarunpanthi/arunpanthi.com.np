<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes"
  >
  <meta name="description" content="404 - Page not found. Redirecting to homepage.">
  <title>404 • Page Not Found</title>

  <!-- Final warning: If you repeat this activity, you will be banned from using this website. -->

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/fontawesome/css/all.min.css?v=20260924">

  <link rel="stylesheet" href="/css/404.css">
</head>
<body>

  <div class="page-wrap">
    <main class="error-card">
      <h1 class="error-code">404</h1>
      <p class="error-message">🚧 Oops! Route not found.</p>
      <p class="error-description">
        Our engineers are looking into it. Thanks for your patience!
      </p>

      <div class="countdown-box">
        <span class="countdown-label">⏳ Redirecting in</span>
        <span class="countdown" id="countdownTimer" aria-live="polite">5</span>
      </div>

      <a href="https://arunpanthi.com.np/" class="home-link">
        <i class="fas fa-home"></i>
        Homepage
        <i class="fas fa-arrow-right"></i>
      </a>

      <div class="animation-area">
        <div class="road">
          <div class="road-lines"></div>

          <div class="car drive" id="car">
            <i class="fas fa-car-side"></i>
          </div>

          <div class="sign-404" id="sign404">404</div>
          <div class="gravel"></div>
        </div>
      </div>
    </main>
  </div>

  <script>
    (function () {
      "use strict";

      const examMatch = window.location.pathname.match(
        /^\/Psc-preparation\/Current-Affairs\/exam\/date=(\d{4}-\d{2}-\d{2})\/?$/
      );
      if (examMatch) {
        const examParams = new URLSearchParams(window.location.search);
        examParams.set("date", examMatch[1]);
        window.location.replace(
          "/Psc-preparation/Current-Affairs/exam.html?" + examParams.toString() + window.location.hash
        );
        return;
      }

      const homepageUrl = "https://arunpanthi.com.np/";
      const car = document.getElementById("car");
      const sign = document.getElementById("sign404");
      const countdownEl = document.getElementById("countdownTimer");
      const homeBtn = document.querySelector(".home-link");

      if (car && sign) {
        setTimeout(() => {
          car.classList.remove("drive");
          car.classList.add("fall");
          sign.classList.add("show");
        }, 1600);
      }

      let secondsLeft = 5;

      const countdownInterval = setInterval(() => {
        secondsLeft -= 1;

        if (countdownEl) {
          countdownEl.textContent = secondsLeft;
        }

        if (secondsLeft <= 0) {
          clearInterval(countdownInterval);
          window.location.href = homepageUrl;
        }
      }, 1000);

      if (homeBtn) {
        homeBtn.addEventListener("click", function () {
          clearInterval(countdownInterval);
        });
      }
    })();
  </script>

  <script src="js/layout.js"></script>
</body>
</html>
