<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="title desc" width="100%">
  <title id="title">Direct shear box test arrangement</title>
  <desc id="desc">Diagram of a direct shear box: a square box split into an upper stationary half and a lower movable half, with the soil sample between them, a vertical normal load N applied through a loading plate on top, and a horizontal shearing force applied to the lower half of the box. The shearing plane is horizontal along the gap between the two halves.</desc>
  <rect width="760" height="430" fill="#ffffff"/>

  <!-- normal load arrow -->
  <line x1="255" y1="40" x2="255" y2="100" stroke="#0d47a1" stroke-width="2.4"/>
  <polygon points="255,112 247,98 263,98" fill="#0d47a1"/>
  <text x="266" y="66" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0d47a1">Normal load, N</text>

  <!-- loading plate -->
  <rect x="170" y="112" width="170" height="14" fill="#8d6e63" stroke="#4e342e" stroke-width="1.5"/>

  <!-- upper box half (stationary) -->
  <rect x="170" y="126" width="30" height="90" fill="#cfd8dc" stroke="#37474f" stroke-width="1.6"/>
  <rect x="310" y="126" width="30" height="90" fill="#cfd8dc" stroke="#37474f" stroke-width="1.6"/>

  <!-- soil sample -->
  <rect x="200" y="126" width="110" height="180" fill="#efebe9"/>
  <!-- soil hatch -->
  <g stroke="#bcaaa4" stroke-width="1">
    <line x1="202" y1="140" x2="306" y2="140"/>
    <line x1="202" y1="156" x2="306" y2="156"/>
    <line x1="202" y1="172" x2="306" y2="172"/>
    <line x1="202" y1="240" x2="306" y2="240"/>
    <line x1="202" y1="256" x2="306" y2="256"/>
    <line x1="202" y1="272" x2="306" y2="272"/>
    <line x1="202" y1="288" x2="306" y2="288"/>
  </g>

  <!-- lower box half (movable) -->
  <rect x="170" y="216" width="30" height="90" fill="#b0bec5" stroke="#37474f" stroke-width="1.6"/>
  <rect x="310" y="216" width="30" height="90" fill="#b0bec5" stroke="#37474f" stroke-width="1.6"/>

  <!-- shear gap / failure plane -->
  <line x1="150" y1="216" x2="380" y2="216" stroke="#c62828" stroke-width="2" stroke-dasharray="8 5"/>

  <!-- box outlines on top of soil -->
  <rect x="170" y="126" width="170" height="90" fill="none" stroke="#37474f" stroke-width="1.6"/>
  <rect x="170" y="216" width="170" height="90" fill="none" stroke="#37474f" stroke-width="1.6"/>

  <!-- base plate -->
  <rect x="150" y="306" width="210" height="16" fill="#607d8b" stroke="#37474f" stroke-width="1.5"/>
  <g stroke="#37474f" stroke-width="1">
    <line x1="140" y1="330" x2="370" y2="330"/>
    <line x1="150" y1="322" x2="140" y2="330"/>
    <line x1="180" y1="322" x2="170" y2="330"/>
    <line x1="210" y1="322" x2="200" y2="330"/>
    <line x1="240" y1="322" x2="230" y2="330"/>
    <line x1="270" y1="322" x2="260" y2="330"/>
    <line x1="300" y1="322" x2="290" y2="330"/>
    <line x1="330" y1="322" x2="320" y2="330"/>
    <line x1="360" y1="322" x2="350" y2="330"/>
  </g>

  <!-- horizontal shear force -->
  <line x1="470" y1="261" x2="376" y2="261" stroke="#c62828" stroke-width="2.4"/>
  <polygon points="364,261 378,253 378,269" fill="#c62828"/>
  <text x="482" y="257" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#c62828">Horizontal shear force</text>
  <text x="482" y="276" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#c62828">(lower half moves)</text>

  <!-- fixed support for upper half -->
  <line x1="110" y1="171" x2="166" y2="171" stroke="#37474f" stroke-width="2.4"/>
  <line x1="110" y1="155" x2="110" y2="187" stroke="#37474f" stroke-width="2.4"/>
  <path d="M 100 187 L 120 187 L 110 197 Z" fill="#37474f"/>
  <text x="60" y="146" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#37474f">Upper half</text>
  <text x="60" y="161" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#37474f">held fixed</text>

  <!-- labels on the box -->
  <text x="255" y="166" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#4e342e" text-anchor="middle">Upper half</text>
  <text x="255" y="184" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#4e342e" text-anchor="middle">(stationary)</text>
  <text x="255" y="266" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#37474f" text-anchor="middle">Lower half</text>
  <text x="255" y="284" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#37474f" text-anchor="middle">(movable)</text>

  <!-- failure plane label -->
  <text x="392" y="205" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#c62828">Predetermined horizontal</text>
  <text x="392" y="222" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#c62828">shear / failure plane</text>

  <!-- sample size note -->
  <text x="150" y="378" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#33443a">Shear box: 60 mm × 60 mm × 25 mm sample (box 6 cm × 6 cm × 5 cm)</text>
  <text x="150" y="400" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#33443a">Test repeated on identical samples at different normal loads N to plot the strength envelope</text>
</svg>
